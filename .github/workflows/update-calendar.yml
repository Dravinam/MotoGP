name: Update MotoGP calendar

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build motogp.ics
        run: python update_calendar.py

      - name: Commit if changed
        run: |
          # Compare old vs new, ignoring DTSTAMP (it changes every run)
          git show HEAD:motogp.ics 2>/dev/null | grep -v '^DTSTAMP:' > /tmp/old.ics || true
          grep -v '^DTSTAMP:' motogp.ics > /tmp/new.ics
          if cmp -s /tmp/old.ics /tmp/new.ics; then
            echo "No real changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add motogp.ics
            git commit -m "Update MotoGP calendar"
            git push
          fi
